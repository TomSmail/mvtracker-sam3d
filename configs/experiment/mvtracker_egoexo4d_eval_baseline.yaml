# @package _global_
defaults:
  - override /model: mvtracker

experiment_path: ./logs/mvtracker_egoexo4d_eval_baseline
restore_ckpt_path: ./checkpoints/mvtracker_200000_june2025.pth

model:
  use_sam3d_knn_bias: false

datasets:
  root: /cluster/home/tsmail/mvtracker-sam3d/datasets  # Local path
  eval:
    names:
      - egoexo4d  # Inference-only, no metrics
    num_workers: 0
    max_seq_len: 300

modes:
  eval_only: true

trainer:
  precision: bf16-mixed

logging:
  log_wandb: false
  save_rerun_viz: true  # Enable qualitative visualization
