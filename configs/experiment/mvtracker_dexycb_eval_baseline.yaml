# @package _global_
defaults:
  - override /model: mvtracker

experiment_path: ./logs/mvtracker_dexycb_eval_baseline
restore_ckpt_path: ./checkpoints/mvtracker_200000_june2025.pth

model:
  use_sam3d_knn_bias: false  # Disable SAM3D

datasets:
  root: /cluster/scratch/tsmail/datasets
  eval:
    names:
      - dex-ycb-multiview-views0123-cached
      - dex-ycb-multiview-views0123-removehand-cached
    num_workers: 0
    max_seq_len: 300

modes:
  eval_only: true

trainer:
  precision: bf16-mixed

logging:
  log_wandb: false
