# @package _global_
defaults:
  - override /model: mvtracker

experiment_path: ./logs/mvtracker_egoexo4d_eval_sam3d
restore_ckpt_path: ./checkpoints/mvtracker_200000_june2025.pth

model:
  use_sam3d_knn_bias: true
  sam3d_knn_overfetch: 4

datasets:
  root: /cluster/home/tsmail/mvtracker-sam3d/datasets
  eval:
    names:
      - egoexo4d
    num_workers: 0
    max_seq_len: 300
    use_sam3d: true
    sam3d_checkpoint_path: /cluster/home/tsmail/checkpoints/sam-3d-body-dinov3/model.ckpt
    sam3d_mhr_path: /cluster/home/tsmail/checkpoints/sam-3d-body-dinov3/assets/mhr_model.pt

modes:
  eval_only: true

trainer:
  precision: bf16-mixed

logging:
  log_wandb: false
  save_rerun_viz: true
