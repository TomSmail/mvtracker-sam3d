# @package _global_
defaults:
  - override /model: mvtracker

experiment_path: ./logs/mvtracker_human_finetune_pc_aug
restore_ckpt_path: ./checkpoints/mvtracker_200000_june2025.pth

model:
  use_sam3d_pointcloud_augmentation: true

datasets:
  root: ./datasets
  train:
    name: panoptic-human-training
    batch_size: 1
    sequence_len: 24
    traj_per_sample: 384
    num_workers: 8
  eval:
    names:
      - panoptic-human-views1_7_14_20
      - panoptic-human-views27_16_14_8
      - panoptic-human-views1_4_7_11
    num_workers: 4
    max_seq_len: 1000

trainer:
  num_steps: 5000
  eval_freq: 1000
  viz_freq: 1000
  save_ckpt_freq: 500
  precision: bf16-mixed

logging:
  log_wandb: false

modes:
  validate_at_start: true
