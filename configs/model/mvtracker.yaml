# @package _global_
defaults:
  - default

model:
  _target_: mvtracker.models.core.mvtracker.mvtracker.MVTracker
  sliding_window_len: 12
  stride: 4
  normalize_scene_in_fwd_pass: false
  fmaps_dim: 128
  add_space_attn: true
  num_heads: 6
  hidden_size: 256
  space_depth: 6
  time_depth: 6
  num_virtual_tracks: 64
  use_flash_attention: true
  corr_n_groups: 1
  corr_n_levels: 4
  corr_neighbors: 16
  corr_add_neighbor_offset: true
  corr_add_neighbor_xyz: false
  corr_filter_invalid_depth: false   # slower, but would make sure points with invalid depth are not considered in corr
  use_sam3d_knn_bias: false          # set true to enable SAM3D-guided kNN re-ranking
  sam3d_knn_overfetch: 4             # over-fetch factor k' = k * overfetch before re-ranking
  use_sam3d_pointcloud_augmentation: false  # set true to augment point cloud with SAM3D mesh vertices
  pc_aug_fusion_mode: 'mean'               # 'mean', 'depth_weighted', or 'consensus' (MV-SAM3D-inspired)
  pc_aug_alpha_depth: 15.0                 # sharpness for depth-consistency weighting
  pc_aug_alpha_feat: 5.0                   # sharpness for feature consensus weighting
  pc_aug_min_confidence: 0.0               # filter vertices with max weight below this
  pc_aug_replace_radius: 0.0               # if > 0, remove depth points within this radius of mesh vertices

evaluation:
  interp_shape: [ 384, 512 ]

  predictor_settings:
    kubric:
      visibility_threshold: 0.5
      grid_size: 4
      local_grid_size: 18
    dex_ycb:
      visibility_threshold: 0.01
      grid_size: 4
      local_grid_size: 18
    panoptic:
      visibility_threshold: 0.01
      grid_size: 6
      local_grid_size: 18
    tapvid2d-davis:
      visibility_threshold: 0.01
      grid_size: 6
      n_grids_per_view: 6
      local_grid_size: 0
      local_extent: 50
      sift_size: 0
      num_uniformly_sampled_pts: 0
    generic:
      visibility_threshold: 0.01
      grid_size: 4
      local_grid_size: 18

trainer:
  precision: bf16-mixed
